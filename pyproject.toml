[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "comfy-toolkit"
version = "0.1.0"
description = "A small, dependency-free Python toolkit for driving ComfyUI over its HTTP API: progress tracking that survives the /history race, dynamic LoRA injection, and video output extraction."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Tangyi Studio" }]
keywords = ["comfyui", "stable-diffusion", "workflow", "api-client", "lora"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
ws = ["websocket-client>=1.0"]
dev = ["pytest>=7.0", "websocket-client>=1.0"]

[project.urls]
Homepage = "https://github.com/TangyiStudio/comfy-toolkit"
Source = "https://github.com/TangyiStudio/comfy-toolkit"
Issues = "https://github.com/TangyiStudio/comfy-toolkit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/comfy_toolkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
